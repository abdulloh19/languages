services:
  # 1. Python FastAPI Backend & Telegram Bot
  - type: web
    name: tilsevar-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r bot_service/requirements.txt"
    startCommand: "cd bot_service && python main.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        value: "sqlite:///./tilsevar.db"

  # 2. Next.js Telegram Mini App
  - type: web
    name: tilsevar-miniapp
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: "cd miniapp && npm install --legacy-peer-deps && npm run build"
    startCommand: "cd miniapp && npm run start"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BACKEND_URL
        fromService:
          type: web
          name: tilsevar-backend
          property: host
